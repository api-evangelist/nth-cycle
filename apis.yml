aid: nth-cycle
name: Nth Cycle
description: >-
  Nth Cycle is a critical mineral refining company headquartered in Beverly, Massachusetts, that
  recovers production-grade nickel, cobalt, copper and rare earth elements from mined ore, low-grade
  tailings and recycled industrial scrap. Its patented OYSTER platform uses electro-extraction — an
  alternative to conventional hydrometallurgy and pyrometallurgy that combines electrochemistry,
  filtration and chemical precipitation into a single continuous, closed-loop architecture — to
  deliver modular refining at roughly 70% lower capital intensity, 75% less waste, and economic
  viability at 5-10x smaller scale than a centralized refinery. Systems install inside existing
  buildings and can be deployed in as little as two years including permitting, under licensing,
  build-own-operate tolling, or multi-feedstock off-take models. The company operates the first
  domestic commercial-scale nickel and cobalt scrap refining system in Fairfield, Ohio, holds a
  $1.1 billion offtake agreement with Trafigura, was selected by the U.S. Department of Energy for
  award negotiations of up to $100 million toward a new critical mineral refining facility, and has
  announced a NYSE listing via business combination with Kensington Capital Acquisition Corp. VI.
  Enrichment probing on 2026-08-26 found no public developer API, OpenAPI/Swagger/GraphQL/AsyncAPI
  contract, developer portal, SDK or package-registry entry, CLI, MCP server, A2A agent card,
  gRPC/Protobuf or WSDL contract, webhook surface, or served /.well-known document — Nth Cycle is a
  materials refining company, not an API provider.
